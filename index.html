<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Wave</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070914;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
}

#ui {
    position: fixed;
    top: 18px;
    left: 20px;
    color: white;
    z-index: 2;
    pointer-events: none;
    text-shadow: 0 2px 8px #000;
}

#score {
    font-size: 28px;
    font-weight: 800;
}

#hint {
    margin-top: 5px;
    font-size: 14px;
    opacity: .7;
}

#gameover {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: #03050faa;
    color: white;
    text-align: center;
    z-index: 3;
}

.panel {
    padding: 30px 42px;
    border: 1px solid #ffffff33;
    border-radius: 18px;
    background: #0c1023ee;
    box-shadow: 0 0 45px #6450ff40;
}

h1 {
    margin: 0 0 8px;
    font-size: 48px;
}

button {
    margin-top: 18px;
    padding: 11px 24px;
    border: 0;
    border-radius: 10px;
    background: #7c5cff;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div id="score">0</div>
    <div id="hint">
        HOLD / CLICK = RISE &nbsp; • &nbsp; RELEASE = FALL
    </div>
</div>

<div id="gameover">
    <div class="panel">
        <h1>CRASHED</h1>
        <div id="final"></div>
        <button onclick="restart()">TRY AGAIN</button>
    </div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const over = document.getElementById("gameover");
const finalEl = document.getElementById("final");

let W, H, dpr;
let player;
let obstacles;
let particles;

let distance;
let speed;
let alive;
let holding;
let spawnTimer;
let last;


/* =========================
   SCREEN SIZE
========================= */

function resize() {

    dpr = Math.min(devicePixelRatio || 1, 2);

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

addEventListener("resize", resize);

resize();


/* =========================
   START / RESTART
========================= */

function restart() {

    player = {
        x: W * 0.23,
        y: H * 0.5,

        size: 10,

        // Vertical speed
        vy: 0,

        // Previous positions for the neon trail
        trail: []
    };

    obstacles = [];
    particles = [];

    distance = 0;

    speed = 5.2;

    alive = true;
    holding = false;

    spawnTimer = 0;

    over.style.display = "none";

    last = performance.now();

    requestAnimationFrame(loop);
}


/* =========================
   CREATE OBSTACLE
========================= */

function makeObstacle(x) {

    const gap = Math.max(
        125,
        H * 0.23 - distance * 0.0008
    );

    const center =
        100 + Math.random() * (H - 200);

    obstacles.push({
        x: x,
        gapY: center,
        gap: gap,
        w: 70,
        passed: false
    });
}


/* =========================
   PARTICLES
========================= */

function particle(x, y) {

    particles.push({
        x: x,
        y: y,

        life: 1,

        vx: -1 - Math.random() * 2,

        vy: (Math.random() - 0.5) * 1.5,

        r: 2 + Math.random() * 3
    });
}


/* =========================
   COLLISION
========================= */

function circleRect(cx, cy, r, rx, ry, rw, rh) {

    const x = Math.max(
        rx,
        Math.min(cx, rx + rw)
    );

    const y = Math.max(
        ry,
        Math.min(cy, ry + rh)
    );

    return (
        (cx - x) ** 2 +
        (cy - y) ** 2
    ) < r * r;
}


/* =========================
   CRASH
========================= */

function crash() {

    if (!alive) return;

    alive = false;

    for (let i = 0; i < 35; i++) {
        particle(player.x, player.y);
    }

    finalEl.textContent =
        "Score: " + Math.floor(distance / 10);

    over.style.display = "grid";
}


/* =========================
   SPIKES
========================= */

function triangle(x, y, up) {

    const s = 22;

    ctx.beginPath();

    if (up) {

        ctx.moveTo(x, y);

        ctx.lineTo(
            x + s / 2,
            y + s
        );

        ctx.lineTo(
            x - s / 2,
            y + s
        );

    } else {

        ctx.moveTo(x, y);

        ctx.lineTo(
            x + s / 2,
            y - s
        );

        ctx.lineTo(
            x - s / 2,
            y - s
        );
    }

    ctx.closePath();

    ctx.fill();
}


/* =========================
   GAME LOOP
========================= */

function loop(now) {

    if (!alive) {

        draw();

        return;
    }

    const dt =
        Math.min(
            (now - last) / 16.67,
            2
        );

    last = now;


    /* =========================
       SPEED
    ========================= */

    distance += speed * dt;

    speed = Math.min(
        10,
        5.2 + distance / 5000
    );


    /* =========================
       WAVE MOVEMENT
    ========================= */

    /*
       HOLD  → move upward
       RELEASE → move downward

       Reduced acceleration makes
       the wave much easier to control.
    */

    player.vy +=
        (holding ? -0.42 : 0.42) * dt;

    player.vy =
        Math.max(
            -5.5,
            Math.min(5.5, player.vy)
        );

    player.y += player.vy * dt;


    /* =========================
       CEILING / FLOOR
    ========================= */

    if (
        player.y < 34 ||
        player.y > H - 34
    ) {
        crash();
    }


    /* =========================
       TRAIL
    ========================= */

    player.trail.push({
        x: player.x,
        y: player.y
    });

    if (player.trail.length > 18) {
        player.trail.shift();
    }

    if (Math.random() < 0.8) {
        particle(
            player.x - 7,
            player.y
        );
    }


    /* =========================
       SPAWN OBSTACLES
    ========================= */

    spawnTimer += dt;

    if (spawnTimer > 72) {

        makeObstacle(W + 40);

        spawnTimer = 0;
    }


    /* =========================
       MOVE OBSTACLES
    ========================= */

    for (const o of obstacles) {

        o.x -= speed * dt;


        // Top wall collision
        if (
            circleRect(
                player.x,
                player.y,
                player.size,

                o.x,
                0,

                o.w,
                o.gapY - o.gap / 2
            )
        ) {
            crash();
        }


        // Bottom wall collision
        if (
            circleRect(
                player.x,
                player.y,
                player.size,

                o.x,
                o.gapY + o.gap / 2,

                o.w,
                H
            )
        ) {
            crash();
        }
    }


    obstacles =
        obstacles.filter(
            o => o.x > -100
        );


    /* =========================
       PARTICLE UPDATE
    ========================= */

    particles.forEach(p => {

        p.x += p.vx * dt;

        p.y += p.vy * dt;

        p.life -= 0.035 * dt;
    });

    particles =
        particles.filter(
            p => p.life > 0
        );


    /* =========================
       SCORE
    ========================= */

    scoreEl.textContent =
        Math.floor(distance / 10);


    draw();

    requestAnimationFrame(loop);
}


/* =========================
   DRAW EVERYTHING
========================= */

function draw() {

    /* Background */

    const g =
        ctx.createLinearGradient(
            0,
            0,
            W,
            H
        );

    g.addColorStop(
        0,
        "#080b22"
    );

    g.addColorStop(
        1,
        "#170720"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Grid */

    ctx.strokeStyle =
        "#7882ff14";

    ctx.lineWidth = 1;

    const off =
        distance * 0.35 % 50;

    for (
        let x = -off;
        x < W;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(x, H);

        ctx.stroke();
    }

    for (
        let y = 25;
        y < H;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(W, y);

        ctx.stroke();
    }


    /* Ceiling / Floor */

    ctx.fillStyle = "#151a3d";

    ctx.fillRect(
        0,
        0,
        W,
        22
    );

    ctx.fillRect(
        0,
        H - 22,
        W,
        22
    );


    /* Ceiling / Floor spikes */

    ctx.fillStyle = "#8b5cff";

    for (
        let x = 0;
        x < W;
        x += 22
    ) {

        triangle(
            x + 11,
            22,
            true
        );

        triangle(
            x + 11,
            H - 22,
            false
        );
    }


    /* Obstacles */

    for (const o of obstacles) {

        ctx.fillStyle = "#22275a";

        // Top wall
        ctx.fillRect(
            o.x,
            0,
            o.w,
            Math.max(
                0,
                o.gapY - o.gap / 2
            )
        );

        // Bottom wall
        ctx.fillRect(
            o.x,
            o.gapY + o.gap / 2,
            o.w,
            H
        );


        /* Spikes */

        ctx.fillStyle = "#ff3f8e";

        for (
            let x = o.x + 10;
            x < o.x + o.w;
            x += 22
        ) {

            triangle(
                x,
                o.gapY - o.gap / 2,
                true
            );

            triangle(
                x,
                o.gapY + o.gap / 2,
                false
            );
        }
    }


    /* Particles */

    for (const p of particles) {

        ctx.globalAlpha =
            p.life * 0.55;

        ctx.fillStyle = "#7c5cff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;


    /* Player trail */

    ctx.lineWidth = 4;

    ctx.strokeStyle = "#b9a6ff";

    ctx.shadowBlur = 16;

    ctx.shadowColor = "#8b5cff";

    ctx.beginPath();

    player.trail.forEach(
        (pt, i) => {

            if (i) {

                ctx.lineTo(
                    pt.x,
                    pt.y
                );

            } else {

                ctx.moveTo(
                    pt.x,
                    pt.y
                );
            }
        }
    );

    ctx.stroke();


    /* Player */

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.moveTo(
        player.x + 15,
        player.y
    );

    ctx.lineTo(
        player.x - 8,
        player.y - 8
    );

    ctx.lineTo(
        player.x - 3,
        player.y
    );

    ctx.lineTo(
        player.x - 8,
        player.y + 8
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================
   CONTROLS
========================= */

function hold(value) {

    if (alive) {
        holding = value;
    }
}


/* Keyboard */

addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp"
        ) {

            e.preventDefault();

            hold(true);
        }


        if (
            e.code === "KeyR" &&
            !alive
        ) {

            restart();
        }
    }
);


addEventListener(
    "keyup",
    e => {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp"
        ) {

            hold(false);
        }
    }
);


/* Mouse */

canvas.onmousedown = () => {
    hold(true);
};

addEventListener(
    "mouseup",
    () => {
        hold(false);
    }
);


/* Touch */

canvas.ontouchstart = e => {

    e.preventDefault();

    hold(true);
};

canvas.ontouchend = e => {

    e.preventDefault();

    hold(false);
};


/* START */

restart();

</script>

</body>
</html>
